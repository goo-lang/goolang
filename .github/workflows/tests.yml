name: tests

# THE authoritative gate, run on every push and every pull request.
#
# It calls ONE target: `make verify-core`. The Makefile defines that as the
# full probe net minus the CompCert bootstrap pilot, and CLAUDE.md designates
# it "the authoritative ccomp-free gate; safe for pre-push on any machine".
#
# WHY ONE TARGET AND NOT A LIST. This workflow used to name its probes by hand.
# The gate set grew to 190 targets and the list still named 43, so 147 gates —
# including every ARC/memory gate — were absent while the workflow reported
# green. A hand-maintained list of a moving set rots silently. `verify-core` is
# the set, so it cannot drift.
#
# HISTORY OF THE `on:` KEY, because it was disabled for a stated reason that no
# longer holds. Between 2026-06-27 and 06-28, 52 push/PR runs failed, each
# aborting in ~3s with no steps — the billing-block signature. Commit 413e121
# then reduced this workflow to workflow_dispatch only, recorded as "this repo
# does not pay for GitHub Actions". On 2026-07-05, 40 workflow_dispatch runs
# on this same repo PASSED in 33-51s each, so the block had cleared and nobody
# re-tested the push path. goo-lang/goolang is a PUBLIC repository, and
# standard GitHub-hosted runners are free for public repositories. Local git
# hooks (.githooks/) stay as the pre-push gate; `git push --no-verify` bypasses
# them, which is exactly the hole this closes.
# ONE run per commit, and the trigger list is what achieves it — not the
# concurrency group below.
#
# An unrestricted `push:` plus `pull_request:` fires BOTH for every commit on a
# PR branch, so each commit started two identical runs here and two in demos —
# four jobs for one commit. Measured on 2026-07-29: of the four on PR #272, the
# `demos` push run never picked up a runner and sat in_progress with ZERO steps
# for 1h43m, while its twin on the other event passed in 45s.
#
# A CONCURRENCY GROUP DOES NOT FIX THAT, and the first attempt at this change
# assumed it would. `github.ref` is `refs/heads/<branch>` for push and
# `refs/pull/<N>/merge` for pull_request, so the two events can never share a
# key. Neither does the popular `github.head_ref || github.ref` idiom: it gives
# the bare branch name for a PR and the full ref for a push. Measured — all four
# runs coexisted with the group in place.
#
# So: push is restricted to main, which is the only branch whose commits are not
# already covered by a pull request. Every merge still gets a verdict, which is
# the whole point of #271, and every PR commit gets exactly one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# What the group IS for: superseding earlier commits on the SAME pull request.
# Push three times in a minute and only the last one needs a verdict.
#
# cancel-in-progress is OFF for main, deliberately. Cancelling a superseded run
# on a branch is free. On main it is not: two merges landing close together
# would cancel the first one's run, and that commit is shipped history with no
# verdict at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-core:
    runs-on: ubuntu-24.04
    # verify-core runs 493 golden fixtures twice (-O0 and -O2) plus valgrind and
    # tsan gates. Generous, because a timeout that fires mid-suite is a red that
    # says nothing. A public repo's job limit is 6h.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        # gcc-14: the Makefile uses -std=c23 (gcc-13, the distro default, rejects it).
        # bison: src/parser/parser.tab.c is GENERATED and not committed.
        # llvm-dev: codegen links against llvm-config (-DLLVM_AVAILABLE).
        # clang + libblocksruntime-dev: three concurrency targets compile with
        #   `clang -fblocks`; clang also carries the tsan/asan runtimes.
        # valgrind: arena-valgrind-probe and arc-release-probe need it.
        # cmake: builds nng from the vendored tarball in third_party/.
        # json-c / curl / zlib: LDFLAGS links -ljson-c -lcurl -lz.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc-14 bison llvm-dev clang libblocksruntime-dev \
            valgrind cmake \
            libjson-c-dev libcurl4-openssl-dev zlib1g-dev

      - name: Tool versions
        run: |
          gcc-14 --version | head -1
          clang --version | head -1
          bison --version | head -1
          valgrind --version
          cmake --version | head -1
          (ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1 | xargs -r -I{} {} --version) || echo "no llvm-config"

      - name: make verify-core
        # Pin LLVM_CONFIG to whatever versioned binary llvm-dev provides, since
        # the Makefile probes llvm-config-20 / unversioned llvm-config first. A
        # make-var assignment overrides the Makefile's `LLVM_CONFIG = ...`.
        #
        # GOLDEN_JOBS is pinned to the runner's core count rather than left to
        # nproc's default so the value is visible in the log.
        run: |
          export GOMAXPROCS=4
          LLVMCFG="$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)"
          echo "Using LLVM_CONFIG=${LLVMCFG:-llvm-config}"
          make CC=gcc-14 LLVM_CONFIG="${LLVMCFG:-llvm-config}" \
            GOLDEN_JOBS="$(nproc)" verify-core 2>&1 | tee verify-core.log
          exit "${PIPESTATUS[0]}"

      - name: Prove the skip-prone gates actually ran
        # A GATE THAT SILENTLY SKIPS IS NOT A GATE. Three targets print SKIPPED
        # and return SUCCESS when their tool is absent:
        #   arc-release-probe     / arena-valgrind-probe  -> valgrind
        #   obj-header-tsan                               -> clang
        # They are exactly the gates guarding the ARC release path, so a runner
        # missing a package would report green while testing none of it. The
        # install step above is the fix; this step is the proof it worked, and
        # it fails the build if any of them skipped.
        if: always()
        run: |
          rc=0
          # The two valgrind gates print a BARE "valgrind not found — SKIPPED"
          # with no gate name, and they skip BEFORE their own === header, so no
          # gate-named line appears at all. Name that cause explicitly.
          if grep -q "valgrind not found" verify-core.log; then
            echo "::error::valgrind is missing — arc-release-probe and arena-valgrind-probe proved nothing"
            rc=1
          fi
          # Then require a positive PASS from each. Absence is a failure, so a
          # skip for any other reason cannot read as green either.
          for gate in arc-release-probe arena-valgrind-probe obj-header-tsan; do
            if grep -q "^${gate}: PASS" verify-core.log; then
              echo "ok: ${gate} ran and passed"
            else
              echo "::error::${gate} did not report PASS — it skipped or never ran"
              rc=1
            fi
          done
          exit $rc

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-core-log
          path: verify-core.log
          retention-days: 14

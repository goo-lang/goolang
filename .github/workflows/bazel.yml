name: bazel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-24.04, not ubuntu-latest, to match tests.yml. The environment here
    # deliberately mirrors that workflow: the same distro, the same gcc-14, and
    # the same "whatever llvm-dev gave us" llvm-config.
    runs-on: ubuntu-24.04
    name: bazel test //...
    steps:
      - uses: actions/checkout@v4

      # gcc-14: the code is -std=c23 and gcc-13, the distro default, rejects it.
      # llvm-dev: codegen links against the LLVM C API.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 bison llvm-dev clang
          gcc-14 --version | head -1

      # The .bazelrc pins /usr/bin/gcc, which is correct on the development
      # workstation and WRONG here: this runner's /usr/bin/gcc is gcc-13 and
      # rejects -std=c23. The override below is the whole reason CC is a
      # --repo_env setting rather than a hard-coded toolchain.
      #
      # llvm-dev installs a VERSIONED llvm-config and no unversioned one, so
      # the path is discovered rather than assumed. Fail loudly here if neither
      # exists, rather than inside a repository rule.
      - name: Resolve the toolchain paths
        id: tc
        run: |
          test -x /usr/bin/gcc-14 || { echo "::error::gcc-14 missing"; exit 1; }
          LLVMCFG="$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LLVMCFG" ]; then
            LLVMCFG="$(command -v llvm-config || true)"
          fi
          if [ -z "$LLVMCFG" ]; then
            echo "::error::no llvm-config found after installing llvm-dev"
            exit 1
          fi
          echo "Using $LLVMCFG ($($LLVMCFG --version))"
          echo "llvm_config=$LLVMCFG" >> "$GITHUB_OUTPUT"

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: bazel test //...
        run: |
          bazel test //... \
            --repo_env=CC=/usr/bin/gcc-14 \
            --repo_env=GOO_LLVM_CONFIG=${{ steps.tc.outputs.llvm_config }} \
            --test_output=errors

      # Writes a package into the tree, so it is tagged manual and skipped by
      # //... above. It must be run explicitly or it never runs at all, and a
      # self-test that never runs is indistinguishable from one that passes.
      - name: Prove parity.sh can report a change
        run: ./tools/parity_selftest.sh

  parity:
    runs-on: ubuntu-24.04
    name: gate parity (informational until phase 7)
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # parity.sh exits 1 by design until every gate is migrated, so this job
      # PUBLISHES the count rather than gating on it, and exits 0.
      #
      # It deliberately does NOT use continue-on-error. That leaves a red X on
      # every single PR for the length of the migration, and a check that is
      # always red trains reviewers to ignore red checks -- which costs more
      # than this number is worth. The count goes to the job summary instead,
      # where it is visible without being alarming.
      #
      # PHASE 7: delete the `|| true` and the `exit 0` below. From that point a
      # non-zero parity.sh must fail this job, because reaching zero is what
      # licenses deleting the Makefile.
      - name: Report unmapped gates
        run: |
          set +e
          out="$(./tools/parity.sh)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          unmapped="$(printf '%s\n' "$out" | sed -n 's/^unmapped:[[:space:]]*//p')"
          mapped="$(printf '%s\n' "$out" | sed -n 's/^mapped:[[:space:]]*//p')"
          total="$(printf '%s\n' "$out" | sed -n 's/^make gates:[[:space:]]*//p')"
          {
            echo "### Gate parity"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Make gates | ${total:-?} |"
            echo "| Mapped to a Bazel test | ${mapped:-?} |"
            echo "| **Unmapped** | **${unmapped:-?}** |"
            echo ""
            if [ "$rc" -eq 0 ]; then
              echo "Every gate has a Bazel test. Phase 7 may delete the Makefile."
            else
              echo "Informational until phase 7. The Makefile stays until this reaches 0."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  differential:
    runs-on: ubuntu-24.04
    name: both compilers emit identical IR
    # Builds BOTH build systems, because comparing them is the whole point.
    # This job is migration-time only: phase 7 deletes it along with the
    # Makefile and tools/compiler_differential.sh.
    steps:
      - uses: actions/checkout@v4

      # bin/goo's link line is `-lm -pthread -ljson-c -lcurl -lz`, so the
      # make build needs those dev packages. The first version of this job
      # omitted them and died on "cannot find -ljson-c". tests.yml installs the
      # same set.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc-14 bison llvm-dev clang \
            libjson-c-dev libcurl4-openssl-dev zlib1g-dev

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # Both compilers, then the comparison, in ONE step.
      #
      # The llvm-config path is resolved into a SHELL variable here rather than
      # a step output, and that is deliberate. scripts/workflow_targets_probe.sh
      # parses every `make <target>` a workflow runs and asserts the target
      # exists; it cannot parse a ${{ }} expression, so
      # `make ... LLVM_CONFIG="${{ steps.tc.outputs.llvm_config }}" bin/goo`
      # made it read the expression itself as a target name and fail. The line
      # would have expanded correctly on the runner, but a gate that cannot
      # verify a line cannot protect it. tests.yml already uses this shell-var
      # form; matching it keeps both workflows checkable.
      - name: Build both compilers and compare their IR
        run: |
          test -x /usr/bin/gcc-14 || { echo "::error::gcc-14 missing"; exit 1; }
          LLVMCFG="$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LLVMCFG" ]; then LLVMCFG="$(command -v llvm-config || true)"; fi
          if [ -z "$LLVMCFG" ]; then echo "::error::no llvm-config found"; exit 1; fi
          echo "Using $LLVMCFG ($($LLVMCFG --version))"

          make CC=gcc-14 LLVM_CONFIG="${LLVMCFG:-llvm-config}" bin/goo

          bazel build //src/compiler:goo \
            --repo_env=CC=/usr/bin/gcc-14 \
            --repo_env=GOO_LLVM_CONFIG="$LLVMCFG"

          ./tools/compiler_differential.sh

          # The golden suite on a fully Bazel-built toolchain. Asserts
          # 486 passed / 9 failed exactly -- the 9 reach the far transport and
          # need NNG, which is phase 3c.
          bazel build //src/runtime:goo_runtime_archive \
            --repo_env=CC=/usr/bin/gcc-14 \
            --repo_env=GOO_LLVM_CONFIG="$LLVMCFG"

          ./tools/golden_bazel.sh

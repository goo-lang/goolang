name: demos

# Minimal gate: build and run the demo targets so build/link/runtime bit-rot
# is caught automatically. Intentionally scoped to the demos (fast, focused).
#
# NOT redundant with tests.yml, which was the assumption when this was nearly
# deleted. MEASURED against the Makefile: demo-work-stealing,
# demo-structured-concurrency, demo-async-resource and demo-reactive-programming
# are NONE of them in VERIFY_ALL_DEPS, so `make verify-core` does not build or
# run any of them. The AddressSanitizer step below is likewise unique to this
# workflow. Deleting this file would drop that coverage silently.
#
# The old comment here recorded auto-run as disabled because "this repo does not
# pay for GitHub Actions". See tests.yml for the run history that disproves it:
# the billing block cleared before 2026-07-05, and this repository is public, so
# standard runners are free.
# push is restricted to main so a PR commit gets ONE run, not two. See tests.yml
# for the measurement, and for why a concurrency group cannot do this job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# See tests.yml for the full reasoning, including why main never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  demos:
    runs-on: ubuntu-24.04
    # This workflow takes about 45s. GitHub's DEFAULT is 360 minutes, so a run
    # that never gets a runner hangs for six hours and the PR shows a check
    # that is neither green nor red. Measured on 2026-07-29: run 30435298482 sat
    # in_progress with zero steps for 1h43m before it was cancelled by hand. 30
    # minutes is ~40x the real cost and turns that state into a fast red.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        # gcc-14: the Makefile uses -std=c23, which gcc-13 (the distro default)
        # does not accept. clang + libblocksruntime-dev: three concurrency
        # targets compile with `clang -fblocks` linked against -lBlocksRuntime.
        # json-c / curl / zlib: LDFLAGS links -ljson-c -lcurl -lz.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc-14 clang libblocksruntime-dev \
            libjson-c-dev libcurl4-openssl-dev zlib1g-dev

      - name: Compiler versions
        run: |
          gcc-14 --version | head -1
          clang --version | head -1

      - name: Build and run demos
        # Each demo-* target builds AND runs (non-zero exit fails the job).
        # CC=gcc-14 overrides the Makefile's hardcoded `CC = gcc`; BLOCKS_CC
        # stays clang. A demo crash or non-zero exit is a real failure here.
        run: |
          make CC=gcc-14 demo-work-stealing
          make CC=gcc-14 demo-structured-concurrency
          make CC=gcc-14 demo-async-resource
          make CC=gcc-14 demo-reactive-programming
          make CC=gcc-14 runtime_optimization_demo
          ./runtime_optimization_demo

      - name: AddressSanitizer check (async resource)
        # Guards the NULL-deref / handle-leak class of bug that fix #9 addressed.
        # detect_leaks=0 isolates memory-safety faults from pre-existing,
        # unrelated shutdown-accounting leaks in the demo.
        #
        # `-include include/xalloc.h` is NOT optional, and its absence is why
        # this step was broken. PR #194 routed fixed-size allocations through
        # xmalloc/xcalloc, which are declared only in that header, and the
        # Makefile supplies it for every ordinary build from CFLAGS
        # (Makefile:18). This step hand-writes its compile line, so it did not
        # inherit the flag and stopped compiling with `use of undeclared
        # identifier 'xcalloc'`. Nothing reported it, because auto-run had been
        # off since 2026-06-29 — this was the FIRST push-triggered run since,
        # and it caught it immediately.
        #
        # Keep this line in step with Makefile:18 CFLAGS, or better, stop
        # duplicating the flags: hand-copied build flags rot the same way the
        # hand-copied probe list in tests.yml did.
        run: |
          clang -std=c23 -g -D_GNU_SOURCE -include include/xalloc.h \
            -fsanitize=address -Iinclude \
            -o async_resource_demo_asan \
            examples/async_resource_demo.c src/async/async_resource.c src/errors/error.c \
            -lpthread
          ASAN_OPTIONS=detect_leaks=0 ./async_resource_demo_asan
